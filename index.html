<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancy - AI 工作流作品集</title>
    <meta name="description" content="Victor 的 AI 工作流作品集，包含 AI 漫剧、电商生视频、公众号优化等创意生产力工具">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f1f5f9;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, rgba(139, 92, 246, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(14, 165, 233, 0.8) 0%, transparent 50%),
                linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: gradientShift 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            padding: 70px 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-banner {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            border-radius: 24px;
            font-size: 40px;
            font-weight: 800;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            font-size: 20px;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 50px;
        }

        .project-card {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 20px;
            padding: 20px 20px 28px 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        .project-card:hover::before {
            transform: scaleX(1);
        }

        .project-image {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .project-title {
            font-size: 22px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 12px;
        }

        .project-desc {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 500;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .project-link:hover {
            transform: translateX(4px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .project-link svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .project-link:hover svg {
            transform: translateX(2px);
        }

        footer {
            text-align: center;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #64748b;
            font-size: 14px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 50px 28px;
            }
            h1 {
                font-size: 44px;
            }
            .logo {
                width: 64px;
                height: 64px;
                font-size: 32px;
            }
            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-banner">
            <div class="logo">L</div>
            <h1>Lancy</h1>
            <p class="subtitle">AI 工作流作品集 · 创意生产力工具集合</p>
        </div>

        <div class="projects">
            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826831_0.jpg" alt="AI 漫剧概念图">
                </div>
                <h3 class="project-title">AI 漫剧</h3>
                <p class="project-desc">基于 AI 的漫画短剧自动生成工作流，一键批量生产有声漫画，让创作更高效</p>
                <a href="https://comic.lancy.site" class="project-link">
                    访问项目
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </a>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826864_0.jpg" alt="电商生视频概念图">
                </div>
                <h3 class="project-title">电商生视频</h3>
                <p class="project-desc">商品图片一键转化为带货短视频，智能文案+AI配音+动态转场，短视频生产自动化</p>
                <a href="https://ecommerce.lancy.site" class="project-link">
                    访问项目
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </a>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826890_0.jpg" alt="公众号优化概念图">
                </div>
                <h3 class="project-title">公众号优化</h3>
                <p class="project-desc">个人公众号文章一键排版、配图生成、标题优化一站式工作流，提升内容创作效率</p>
                <a href="https://blog.lancy.site" class="project-link">
                    访问项目
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </a>
            </div>
        </div>

        <footer>
            © 2026 Lancy.site · Crafted with AI
            <div class="social-links">
                <a href="https://github.com/robin-fc" class="social-link" target="_blank">GitHub</a>
                <a href="https://robin-fc.github.io/" class="social-link" target="_blank">Blog</a>
            </div>
        </footer>
    </div>
</body>
</html>
