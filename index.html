<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancy - AI 工作流作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            font-weight: 400;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .project-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 28px 24px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .project-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
        }

        .project-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .project-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #667eea;
            text-decoration: none;
        }

        .project-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid #e5e5e5;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 24px;
            }
            h1 {
                font-size: 36px;
            }
            .projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lancy</h1>
            <p class="subtitle">AI 工作流作品集 · 创意生产力工具集合</p>
        </header>

        <div class="projects">
            <div class="project-card">
                <div class="project-icon">🎬</div>
                <h3 class="project-title">AI 漫剧</h3>
                <p class="project-desc">基于 AI 的漫画短剧自动生成工作流，一键批量生产有声漫画</p>
                <a href="https://comic.lancy.site" class="project-link">
                    访问 →
                </a>
            </div>

            <div class="project-card">
                <div class="project-icon">🛒</div>
                <h3 class="project-title">电商生视频</h3>
                <p class="project-desc">商品图片一键转化为带货短视频，智能文案+AI配音+动态转场</p>
                <a href="https://ecommerce.lancy.site" class="project-link">
                    访问 →
                </a>
            </div>

            <div class="project-card">
                <div class="project-icon">📢</div>
                <h3 class="project-title">公众号优化</h3>
                <p class="project-desc">个人公众号文章一键排版、配图生成、标题优化一站式工作流</p>
                <a href="https://blog.lancy.site" class="project-link">
                    访问 →
                </a>
            </div>
        </div>

        <footer>
            © 2026 Lancy.site · All rights reserved
        </footer>
    </div>
</body>
</html>
