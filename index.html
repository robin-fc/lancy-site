<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lancy - AI 创意工作流</title>
    <meta name="description" content="个人 AI 创意工具集合，汇集 AI 漫剧生成、电商短视频生成、公众号内容优化">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafafa;
            --text-primary: #111111;
            --text-secondary: #666666;
            --border: #e5e5e5;
            --card-hover: #f5f5f5;
            --accent: #111111;
            --white: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 导航栏 */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            text-decoration: none;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* 介绍区域 */
        .intro {
            margin-bottom: 80px;
        }

        .intro h1 {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 32px;
            color: var(--text-primary);
        }

        .intro p {
            font-size: 20px;
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* 项目网格 */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 120px;
        }

        .project-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 0;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .project-card:hover {
            background: var(--card-hover);
        }

        .project-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-content {
            padding: 28px 24px;
        }

        .project-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .project-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            transition: gap 0.2s ease;
        }

        .project-link:hover {
            gap: 12px;
        }

        .project-link svg {
            width: 16px;
            height: 16px;
        }

        /* Footer */
        footer {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 40px 60px;
            border-top: 1px solid var(--border);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copyright {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            gap: 32px;
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: var(--text-primary);
        }

        /* 响应式 */
        @media (max-width: 960px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 32px;
            }
            .intro h1 {
                font-size: 48px;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 40px 20px 30px;
            }
            .container {
                padding: 0 20px;
            }
            footer {
                padding: 30px 20px 40px;
            }
            .intro h1 {
                font-size: 42px;
            }
            .intro p {
                font-size: 18px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .footer-content {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部 Logo -->
    <header>
        <a href="#" class="logo">Lancy</a>
    </header>

    <!-- 介绍区域 -->
    <main class="container">
        <section class="intro">
            <h1>AI 创意<br>工作流集合</h1>
            <p>本网站是出于个人兴趣建造的工具集集合，汇集多个实用 AI 创意生产力工作流。后续持续扩展更多工具入口。</p>
        </section>

        <!-- 项目网格 -->
        <section class="projects-grid">
            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826831_0.jpg" alt="AI 漫剧工作流">
                </div>
                <div class="project-content">
                    <h3 class="project-title">AI 漫剧</h3>
                    <p class="project-desc">基于 AI 的漫画短剧自动生成工作流，一键批量生产有声漫画</p>
                    <a href="https://comic.lancy.site" class="project-link" target="_blank">
                        访问项目
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </a>
                </div>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826864_0.jpg" alt="电商生视频工作流">
                </div>
                <div class="project-content">
                    <h3 class="project-title">电商生视频</h3>
                    <p class="project-desc">商品图片一键转化为带货短视频，智能文案+AI配音+动态转场</p>
                    <a href="https://ecommerce.lancy.site" class="project-link" target="_blank">
                        访问项目
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </a>
                </div>
            </div>

            <div class="project-card">
                <div class="project-image">
                    <img src="images/generated_image_1773826890_0.jpg" alt="公众号优化工作流">
                </div>
                <div class="project-content">
                    <h3 class="project-title">公众号优化</h3>
                    <p class="project-desc">个人公众号文章一键排版、配图生成、标题优化一站式工作流</p>
                    <a href="https://blog.lancy.site" class="project-link" target="_blank">
                        访问项目
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="copyright">© 2026 Lancy.site</div>
            <div class="footer-links">
                <a href="https://github.com/robin-fc" class="footer-link" target="_blank">GitHub</a>
                <a href="https://robin-fc.github.io/" class="footer-link" target="_blank">Blog</a>
            </div>
        </div>
    </footer>
</body>
</html>
